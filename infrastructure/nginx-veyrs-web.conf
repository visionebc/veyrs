# VEYRS product site (veyrs-web.example.com).
# Static, served from BOTH app nodes and reached through the same
# `upstream veyrs_app` as the console: a dedicated container for six HTML
# files would add a single point of failure and a machine to patch, in
# exchange for nothing. TLS is terminated at the fleet proxy.
#
# Versioned here so the nodes cannot drift apart (TD-43). Built with
# scripts/publish-sites.sh (atomic swap of /var/www/veyrs-web).
server {
    listen 80;
    server_name veyrs-web.example.com;
    # HTTPS once a certificate is installed (Configure > Platform > Web
    # certificate): the root veyrs-tls-sync.timer writes the `listen 443 ssl`
    # block into /etc/veyrs/tls/nginx/. An empty glob is a no-op.
    include /etc/veyrs/tls/nginx/*.conf;
    root /var/www/veyrs-web;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Static marketing/manual pages: no script and no inline style anywhere in
    # the output, so the policy can be strict. The fonts are served from
    # /assets/fonts/ (copied from the console's set at build time): nothing is
    # loaded from another origin.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    # `expires`, not add_header: an add_header here would drop every
    # server-level security header for these responses (R-27).
    location /assets/ {
        expires 7d;
    }
}
