# VEYRS Docs Center (documentation site), the default server on the nodes.
#
# Versioned here so the nodes cannot drift apart (TD-43). It is the
# `default_server` on purpose: direct-by-IP access is how the monitoring stack
# scrapes /metrics and how probes reach /healthz, and a hostname that no other
# vhost claims (the documentation host name included) lands here. The console
# vhost (nginx-veyrs-console.conf) must therefore list every console name; see
# tests/test_console_vhost_names.py.
#
# Built with scripts/publish-sites.sh (atomic swap of /var/www/veyrs).
server {
    listen 80 default_server;
    server_name _;
    # HTTPS once a certificate is installed (Configure > Platform > Web
    # certificate): the root veyrs-tls-sync.timer writes the `listen 443 ssl`
    # block into /etc/veyrs/tls/nginx/. An empty glob is a no-op.
    include /etc/veyrs/tls/nginx/*.conf;

    root /var/www/veyrs;
    index index.html;

    # Static, no inline script handlers: the conservative headers are safe. No
    # Content-Security-Policy here: the Docs Center loads its own scripts and
    # fonts and has not been audited for a strict policy.
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # Documentation site (static, no dependencies).
    location / {
        try_files $uri $uri/ =404;
    }

    # VEYRS API. The app binds 127.0.0.1 only; nginx is the single entry point.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # scanner imports are slow by nature
        client_max_body_size 128m; # a full Nessus export is large
    }

    # Interactive API reference. Disabled by the app itself in production
    # (docs_url=None); kept routed so a staging deployment does not need a
    # different vhost.
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Probes: reachable from the LAN for monitoring, never cached.
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-store" always;
        # A location with its own add_header drops every server-level one,
        # so the security headers are repeated here (tests/test_nginx_headers.py).
        add_header X-Frame-Options        "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "no-referrer" always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    }

    # Metrics are authenticated by the app itself (VEYRS_METRICS_TOKEN); this
    # block is defence in depth only.
    #
    # Restricting by $remote_addr only works for callers that bypass the fleet
    # reverse proxy: every proxied request arrives from the proxy's address, so
    # an allowlist that includes the proxy's range controls nothing.
    location /metrics {
        allow 127.0.0.1;
        allow 198.19.1.30;   # monitoring stack, scraping this host directly
        deny all;
        proxy_pass http://127.0.0.1:8000;
    }
}
