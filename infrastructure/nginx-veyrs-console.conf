# VEYRS management console.
#
# The fleet reverse proxy (CT 100, 198.18.50.10) terminates the browser's TLS
# with the *.example.com wildcard; this block serves the console on :80 and,
# once a certificate is installed from the console, on :443 too, and proxies
# the API on the same origin so the browser never makes a cross-origin
# authenticated request.
server {
    listen 80;
    # HTTPS. The certificate is chosen in the console (Configure > Platform >
    # Web certificate) and written here by the root veyrs-tls-sync.timer, which
    # fills /etc/veyrs/tls/nginx/ with the `listen 443 ssl` block. Until a
    # certificate is installed the glob matches nothing and this is a no-op.
    include /etc/veyrs/tls/nginx/*.conf;
    # Both node names are served by BOTH nodes on purpose. The fleet proxy
    # forwards veyrs-app-1 and veyrs-app-2 to the same upstream (a1
    # primary, a2 backup) and preserves the Host header, so a name missing
    # here does not 404: it falls through to the default_server below and
    # serves the documentation site with HTTP 200.
    server_name veyrs-app-1.example.com veyrs-app-2.example.com
                veyrs.example.com veyrs-console.example.com;

    root /var/www/veyrs-console;
    index index.html;

    access_log /var/log/nginx/veyrs-console.access.log;
    error_log  /var/log/nginx/veyrs-console.error.log;

    # The console is an operator surface, not public content.
    add_header X-Frame-Options            "DENY" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "no-referrer" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    # No 'unsafe-inline' for scripts: the console carries no inline handlers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Hash routing: any unknown path is still the single page.
    # `expires -1` = Cache-Control: no-cache. Without it index.html went out
    # with only Last-Modified, browsers cached it heuristically for days, and
    # a deploy that bumped app.js?v= was invisible: the cached page still
    # named the old version. `expires`, not add_header: an add_header here
    # would silently drop every security header declared on the server.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # Self-hosted Inter / JetBrains Mono (CSP font-src 'self').
    location /fonts/ {
        expires 30d;
    }

    # The console links to /documentation, never to "/": on this host "/" IS
    # the console, so a docs link to it just reloaded the page. The Docs Center
    # is its own vhost (default_server, /var/www/veyrs) with root-absolute links,
    # so it cannot be mounted under a prefix here: redirect to it instead.
    location = /documentation {
        return 302 https://veyrs-docs.example.com/;
    }

    # `expires` only: an add_header in a location replaces EVERY add_header of
    # the server block, so this location used to go out without CSP, HSTS or
    # X-Frame-Options (fixed 0.41.0).
    location /static/ {
        alias /var/www/veyrs/static/;
        # `expires`, not add_header: an add_header here would drop every
        # server-level security header for these responses (R-27).
        expires 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 128m;   # scanner exports and PDFs
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-store" always;
        # A location with its own add_header drops every server-level one,
        # so the security headers are repeated here (tests/test_nginx_headers.py).
        add_header X-Frame-Options            "DENY" always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header Referrer-Policy            "no-referrer" always;
        add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
