# VEYRS management console.
#
# TLS is terminated upstream on the fleet reverse proxy (CT 100, 10.50.0.10)
# with the *.example.com wildcard; this block serves the console over the
# LAN hop and proxies the API on the same origin so the browser never makes
# a cross-origin authenticated request.
server {
    listen 80;
    # Both node names are served by BOTH nodes on purpose. The fleet proxy
    # forwards veyrs-app-1 and veyrs-app-2 to the same upstream (a1
    # primary, a2 backup) and preserves the Host header, so a name missing
    # here does not 404: it falls through to the default_server below and
    # serves the documentation site with HTTP 200.
    server_name veyrs-app-1.example.com veyrs-app-2.example.com
                veyrs.example.com veyrs-console.example.com;

    root /var/www/veyrs-console;
    index index.html;

    access_log /var/log/nginx/veyrs-console.access.log;
    error_log  /var/log/nginx/veyrs-console.error.log;

    # The console is an operator surface, not public content.
    add_header X-Frame-Options            "DENY" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "no-referrer" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    # No 'unsafe-inline' for scripts: the console carries no inline handlers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Hash routing: any unknown path is still the single page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        alias /var/www/veyrs/static/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 128m;   # scanner exports and PDFs
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-store" always;
    }
}
