[pytest]
# The backend package lives in backend/, tests at the repo root. Declaring the
# path here (instead of relying on an ambient PYTHONPATH) is what makes the
# suite reproducible for CI and for anyone cloning the repo.
pythonpath = backend
testpaths = tests
addopts = -q --strict-markers
markers =
    integration: requires PostgreSQL/Redis
filterwarnings =
    error::DeprecationWarning:veyrs.*
