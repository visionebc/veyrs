# VEYRS console + same-origin API proxy.
#
# Replaces the image's conf.d/default.conf rather than sitting beside it; the
# stock file claims default_server on :80 and wins on parse order, which serves
# the nginx welcome page from a stack whose every healthcheck is green.
#
# Kept deliberately close to infrastructure/nginx (the host vhost), because two
# deployment paths that serve the same application under different headers are
# two products. The differences are listed where they occur.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DIFFERENCE FROM THE HOST VHOST: no Strict-Transport-Security.
    #
    # This stack terminates plain HTTP -- TLS, if any, belongs to whatever
    # fronts it. Sending HSTS over HTTP is ignored by browsers by design, but
    # sending it from a stack an evaluator reaches on http://localhost:8080
    # would pin that ORIGIN to https for a year the first time it is ever
    # served over TLS, and localhost is an origin shared with every other
    # project on that machine.
    add_header X-Frame-Options        "DENY"                       always;
    add_header X-Content-Type-Options "nosniff"                     always;
    add_header Referrer-Policy        "no-referrer"                 always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # Identical to the host vhost. No 'unsafe-inline' for scripts: the console
    # carries no inline handlers, and tests/test_console_layout_classes.py
    # keeps it that way.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Hash routing: any unknown path is still the single page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # DIFFERENCE FROM THE HOST VHOST: a real directory, not an `alias` into the
    # documentation site's document root. Both are baked into this image, so a
    # console with no tokens stylesheet -- which renders every colour as the
    # browser default and looks like a broken theme -- is not reachable here.
    location /static/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Same origin as the console on purpose: the browser never makes a
    # cross-origin authenticated request, so VEYRS_CORS_ORIGINS is not load
    # bearing for this deployment.
    # =====================================================================
    # RE-RESOLVE THE UPSTREAM. Do not go back to `proxy_pass http://api:8000`.
    # =====================================================================
    # With a literal name, nginx resolves it ONCE at configuration load and
    # caches the address for the life of the worker. Anything that recreates
    # `api` on a different address then leaves this proxy talking to nobody:
    #
    #   502 ... connect() failed (111: Connection refused) while connecting to
    #   upstream, upstream: "http://172.29.0.4:8000/readyz"
    #
    # Measured 2026-09-22: `up --with-workers` on a running stack recreated
    # `api`, left this container alone, and every request returned 502 while
    # `docker compose ps` reported BOTH containers healthy -- this one's probe
    # fetches its own static index, api's probe runs inside api. Green on both
    # sides, dead in between, and the only evidence was in this error log.
    #
    # Pinning api to a static address was tried first and reverted: `docker
    # compose run` creates a SECOND container of that service and cannot reuse
    # a fixed address ("Address already in use"), which takes out
    # `veyrs-docker.sh cli` and the tenant-isolation assertions with it.
    #
    # 127.0.0.11 is Docker's embedded DNS server, the same one the container's
    # /etc/resolv.conf points at. `valid=10s` bounds how long a dead address
    # can be believed; ipv6=off because the stack network is v4-only and an
    # AAAA lookup there is a wasted round trip on every expiry.
    #
    # A VARIABLE in proxy_pass is what defers resolution to request time -- a
    # literal is resolved at startup no matter what resolver is configured.
    # There is no URI part in any of these proxy_pass directives, so the
    # request URI is forwarded exactly as it was before this change.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $veyrs_api api;

    location /api/ {
        proxy_pass http://$veyrs_api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        client_max_body_size 128m;   # scanner exports and PDFs
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://$veyrs_api:8000;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }

    # /docs and /redoc are served by FastAPI and exist only when
    # VEYRS_ENVIRONMENT is not "production" (main.py sets docs_url=None there).
    # Proxied so an evaluator can read the API surface without publishing the
    # API port; it closes itself in production rather than being closed here.
    location ~ ^/(docs|redoc)$ {
        proxy_pass http://$veyrs_api:8000;
        proxy_set_header Host $host;
    }

    # DELIBERATELY NOT PROXIED: /metrics.
    #
    # The exposition enumerates every route template, the build version and the
    # per-endpoint traffic volume -- a map of the attack surface. It is Bearer
    # protected in the app, but there is no reason for the public surface of an
    # evaluation stack to carry it at all. A scrape runs against the api
    # service on the stack network.
    location = /metrics { return 404; }
}
